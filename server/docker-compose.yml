version: '3.9'

# Local/dev stack: Postgres 16 + the API. The schema is applied automatically
# on first boot via docker-entrypoint-initdb.d; seed once with:
#   docker compose exec api npx tsx src/seed.ts
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms -d hrms']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4010
      HOST: 0.0.0.0
      DATABASE_URL: postgres://hrms:hrms@postgres:5432/hrms
      PGSSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_TTL: 12h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '4010:4010'

volumes:
  pgdata:
